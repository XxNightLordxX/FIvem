<!DOCTYPE html>

        <!--
            XP tier — text-only, same reasoning as Distraction above: the
            raw XP count is never sent to the client at all (server-
            authoritative, see client/progression.lua's own header), only
            the current tier's label, so a bar/percentage would be
            fabricating a magnitude that doesn't exist client-side.
        -->
        <div class="k9hud-row k9hud-row--hidden k9hud-row--status" data-stat-row="xpTier">
            <span class="k9hud-label">K9 Tier</span>
            <span class="k9hud-status-value" data-status="xpTier">--</span>
        </div>
    </div>

    <!--
        HANDLER CONDITION BADGE (this pass) -- see app.js's own header
        "HANDLER CONDITION BADGE CONTRACT" section, and server/wellbeing.lua's
        "HANDLER CONDITION BADGE" header section, for the full design.
        Deliberately a SEPARATE element from #k9hud above, not one more row
        inside it: #k9hud's own visibility is driven by CanShowK9UI() --
        true only for the LOCAL player's OWN K9 vitals -- which is false for
        the overwhelming common case this badge exists for (a human handler
        who is not themselves K9-modeled). Starts hidden; only unhidden by a
        `hud:partnerCondition` push carrying `visible: true` (see app.js's
        applyPartnerCondition()) -- independent of #k9hud.hidden, and never
        toggled by anything in this file's own `hud:updateVitals` handling.
    -->
    <div id="k9partner-badge" class="k9partner-badge hidden" aria-hidden="true">
        <span class="k9partner-badge-label" data-partner="label">K9 Partner</span>
        <span class="k9partner-badge-value" data-partner="value">--</span>
    </div>

    <!--
        K9 ONBOARDING HINT (Config.K9Onboarding.enabled) -- see app.js's own
        "ONBOARDING HINT CONTRACT" section, and client/hud.lua's own
        "K9 ONBOARDING HINT" section, for the full design. A SECOND chance
        at the one-time chat line a brand-new K9/handler gets the moment
        their role is granted (easy to miss entirely -- tabbed out,
        mid-conversation, chat scrolled). Deliberately a SEPARATE element
        from #k9hud (bottom-left) and #k9partner-badge (top-left), placed
        top-right so none of the three can ever overlap. Starts hidden;
        only unhidden by a `hud:onboardingHint` push carrying
        `visible: true`.

        NO CLICKABLE DISMISS CONTROL ANYWHERE IN THIS MARKUP, ON PURPOSE:
        this page never calls SetNuiFocus (see app.js's own header), and
        without focus there is no visible cursor for a player to click
        anything with -- see client/hud.lua's own comment on
        IsDisabledControlJustPressed for why dismissing this is a native
        key read on the Lua side instead, never a click here.
    -->
    <div id="k9onboarding-hint" class="k9onboarding-hint hidden" aria-hidden="true">
        <span class="k9onboarding-hint-title" data-onboarding="title">K9 Command Tablet</span>
        <span class="k9onboarding-hint-body" data-onboarding="body">--</span>
        <span class="k9onboarding-hint-dismiss" data-onboarding="dismiss">--</span>
    </div>

    <script src="app.js"></script>

    <!--
        K9 Command Tablet (Config.Features.CommandTablet) -- see
        html/tablet.html/tablet.js/tablet.css/tablet-bridge.js. Deliberately
        isolated in its own document, loaded via this <iframe>, rather than
        a panel added to this file's own DOM/JS/CSS -- see html/tablet.js's
        own "ARCHITECTURE NOTE" header for the full reasoning. This is the
        ONLY addition this feature makes to this file: everything above this
        comment (the passive HUD, app.js) is completely unmodified and
        unaware this exists.

        Starts hidden (see style.css's `.k9tablet-wrap.hidden` rule,
        mirroring `#k9hud.hidden` above) until html/tablet-bridge.js's relay
        receives a 'tablet:open' SendNUIMessage push and un-hides it.
        tablet-bridge.js is the ONLY script that touches this element or
        anything inside this iframe from this document's side -- it never
        touches app.js's own DOM/state, and app.js never touches this.
    -->
    <div id="k9tablet-wrap" class="k9tablet-wrap hidden" aria-hidden="true">
        <iframe id="k9tablet-frame" src="tablet.html" title="K9 Command Tablet" tabindex="-1"></iframe>
    </div>
    <script src="tablet-bridge.js"></script>
</body>
</html>
